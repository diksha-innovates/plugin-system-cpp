name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake/ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install cmake/ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Configure + build + test (Debug)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Configure + build + test (ASan + UBSan)
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON
          cmake --build build-asan
          ctest --test-dir build-asan --output-on-failure

      - name: Configure + build + test (TSan)
        run: |
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_TSAN=ON
          cmake --build build-tsan
          ctest --test-dir build-tsan --output-on-failure
